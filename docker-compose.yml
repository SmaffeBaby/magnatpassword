name: magnat-password
include:
  - path:
      - ./supabase/docker-compose.yml
      - ./supabase/docker-compose.kong.yml
      - ./supabase/docker-compose.local.yml
    env_file: ./supabase/.env
services:
  ollama:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    environment:
      OLLAMA_NO_CLOUD: 'true'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_MAX_QUEUE: '2'
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 12
  ollama-init:
    profiles: ['model-setup']
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    restart: 'no'
    cpus: 1.0
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c']
    command: ['ollama show qwen3:0.6b >/dev/null 2>&1 || ollama pull qwen3:0.6b']
    depends_on:
      ollama:
        condition: service_healthy
  migrate:
    image: supabase/postgres:17.6.1.136
    restart: 'no'
    env_file: ./supabase/.env
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: postgres
    entrypoint: ['/bin/sh', '/migration-runner.sh']
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/migrate.sh:/migration-runner.sh:ro
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NUXT_SUPABASE_URL: http://api-gw:8000
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_OLLAMA_URL: http://ollama:11434
    depends_on:
      migrate:
        condition: service_completed_successfully
      api-gw:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${MAGNAT_RELEASES_DIR:?Set MAGNAT_RELEASES_DIR to the existing SSD release directory}
        target: /releases
        read_only: true
        bind:
          create_host_path: false
    ports:
      - '0.0.0.0:3003:3000'
volumes:
  ollama-models:
