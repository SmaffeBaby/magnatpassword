name: Native build on SSD
on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner_os:
        required: true
        type: string
jobs:
  build:
    runs-on: [self-hosted, magnat-ssd, '${{ inputs.runner_os }}']
    timeout-minutes: 120
    env:
      MAGNAT_SERVER_URL: ${{ vars.MAGNAT_SERVER_URL }}
      RELEASE_PLATFORM: ${{ inputs.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Verify SSD workspace and caches
        run: node scripts/release-storage.mjs
      - name: Load immutable release plan
        run: node scripts/stage-release.mjs load
      - run: npm ci
      - run: node scripts/prepare-release.mjs
      - name: Windows installer
        if: inputs.platform == 'windows'
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --config .local/tauri.release.json
      - name: Apple Silicon macOS installer
        if: inputs.platform == 'macos'
        run: npm run tauri -- build --target aarch64-apple-darwin --bundles app,dmg --config .local/tauri.release.json
      - name: Android release APK
        if: inputs.platform == 'android'
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          node scripts/android-signing.mjs
          npm run tauri -- android build --ci --apk --target aarch64 --config .local/tauri.release.json
      - name: Unsigned iOS archive (no publication)
        if: inputs.platform == 'ios'
        run: |
          npm run ios:init -- --ci
          npm run tauri -- ios build --ci --no-sign --archive-only --target aarch64 --config .local/tauri.release.json
      - name: Store packages on SSD
        run: node scripts/collect-release.mjs "$RELEASE_PLATFORM"
      - name: Remove Android signing material from checkout
        if: always() && inputs.platform == 'android'
        run: node scripts/android-signing.mjs clean
